name: Sort YAML and Build Root Glossary PDF

on:
  push:
    branches:
      - main
    paths:
      - 'root-glossary/roots.yaml'
      - 'root-glossary/sort.py'
      - 'root-glossary/convert.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (PyYAML, XeLaTeX, Charis SIL font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-yaml \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-sil-charis
          pip install pyyaml

      - name: Sort roots.yaml and compile glossary.pdf
        working-directory: root-glossary
        run: |
          python3 sort.py
          python3 convert.py

      - name: Commit and push updated roots.yaml and glossary.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add root-glossary/roots.yaml root-glossary/glossary.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore: sort roots.yaml and update root glossary pdf [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
